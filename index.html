<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1F3D2E" />
  <meta name="format-detection" content="telephone=no" />
  <title>許津銓｜住商不動產RM團隊｜示範版</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&family=Noto+Serif+TC:wght@600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --green: #1F3D2E;
      --green-mid: #234536;
      --green-deep: #15281F;
      --green-soft: #E7EFE9;
      --emerald: #1A4A38;
      --sage: #D4DDD0;
      --olive: #C5CEB6;
      --gold: #C9A45C;
      --gold-soft: #E8D7A8;
      --gold-dim: #A6853F;
      --ivory: #F6F1E6;
      --cream: #FBF7EF;
      --paper: #FFFCF6;
      --foil: linear-gradient(115deg, #8A641F 0%, #E8D7A8 22%, #C9A45C 40%, #FFF3C2 50%, #C9A45C 62%, #A6853F 82%, #8A641F 100%);
      --ink: #1C1A16;
      --ink-soft: #4A453E;
      --muted: #7A7368;
      --line: #E6DFD0;
      --line-strong: #D4CBB8;
      --good: #2F6B4F;
      --good-soft: #E4F0E8;
      --warn: #A67B1F;
      --warn-soft: #F8EED8;
      --bad: #A33B2C;
      --bad-soft: #F8E6E2;
      --info: #3D5A73;
      --info-soft: #E6EEF3;
      --shadow: 0 1px 2px rgba(28,26,22,.05), 0 6px 16px rgba(31,61,46,.07), 0 18px 40px rgba(21,40,31,.08);
      --radius: 12px;
      --cta-h: 64px;
      --demo-h: 44px;
      --safe-b: env(safe-area-inset-bottom, 0px);
      --font: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
      --serif: "Noto Serif TC", "Songti TC", "PMingLiU", serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { background: var(--ivory); color: var(--ink); font-family: var(--font); }
    body { min-height: 100dvh; font-size: 16px; line-height: 1.65; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
    button, input, select, textarea { font-family: inherit; font-size: inherit; }
    button { cursor: pointer; border: 0; background: none; color: inherit; }
    a { color: var(--green); }
    img { max-width: 100%; display: block; }
    .hidden { display: none !important; }
    h1, h2, h3, .serif { font-family: var(--serif); font-weight: 700; letter-spacing: .02em; }

    #intro { position: fixed; inset: 0; z-index: 200; background: var(--green-deep); display: grid; place-items: center; color: var(--gold); transition: opacity .45s ease, visibility .45s ease; }
    #intro.done { opacity: 0; visibility: hidden; pointer-events: none; }
    #intro svg, #intro img { width: 148px; height: 148px; overflow: visible; animation: introPop .9s ease both; object-fit: contain; }
    @keyframes introPop { from { opacity: 0; transform: translateY(8px) scale(.96); } to { opacity: 1; transform: none; } }
    #intro .intro-skip { position: absolute; bottom: calc(28px + var(--safe-b)); left: 50%; transform: translateX(-50%); color: var(--gold-soft); font-size: 12px; letter-spacing: .16em; opacity: .75; padding: 8px 16px; }
    @media (prefers-reduced-motion: reduce) {
      #intro { display: none !important; }
      .reveal { opacity: 1 !important; transform: none !important; transition: none !important; }
      #app.page-out, #app.page-in { opacity: 1 !important; transform: none !important; transition: none !important; }
      .btn-gold::after, .cta-bar a.primary::after { animation: none !important; content: none !important; }
      .hero-diorama { animation: none !important; }
    }

    .demo-ribbon { position: sticky; top: 0; z-index: 60; min-height: var(--demo-h); background: var(--green-deep); color: rgba(232, 215, 168, .82); font-size: 11px; display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 6px 14px; padding: 8px 12px; letter-spacing: .06em; }
    .demo-ribbon b { font-weight: 600; color: var(--gold-soft); }
    .demo-ribbon nav { display: flex; gap: 10px; }
    .demo-ribbon a { color: rgba(232, 215, 168, .7); text-decoration: none; border-bottom: 1px solid transparent; padding-bottom: 1px; }
    .demo-ribbon a.active { color: var(--gold); border-bottom-color: var(--gold); }

    .app { padding-bottom: 12px; }
    body.view-home .app { padding-bottom: calc(var(--cta-h) + var(--safe-b) + 24px); }
    #app { transition: opacity .28s ease, transform .28s ease; }
    #app.page-out { opacity: 0; transform: translateY(8px); }
    #app.page-in { opacity: 1; transform: none; }
    .reveal { opacity: 0; transform: translateY(16px); transition: opacity .7s ease, transform .7s ease; }
    .reveal.in { opacity: 1; transform: none; }
    .wrap { width: min(560px, 100%); margin: 0 auto; padding: 0 20px; }
    .wrap-wide { width: min(760px, 100%); margin: 0 auto; padding: 0 20px; }

    .band { position: relative; isolation: isolate; padding: 12px 0 32px; overflow: hidden; }
    .band > * { position: relative; z-index: 1; }
    .band-forest { background: linear-gradient(180deg, #15281F 0%, #1F3D2E 58%, #234536 100%); }
    .band-emerald { background: linear-gradient(180deg, #16382C 0%, #1A4A38 55%, #1F3D2E 100%); }
    .band-sage { background: linear-gradient(180deg, #E2E8DC 0%, #D4DDD0 100%); }
    .band-olive { background: linear-gradient(180deg, #D2D8C4 0%, #C5CEB6 100%); }
    .band-ivory { background: var(--ivory); }
    .band-cream { background: var(--cream); }
    .band-grain::after, .hero-texture {
      content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 0;
      opacity: .1; mix-blend-mode: overlay;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='80' height='80'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    }
    .band-ivory.band-grain::after, .band-cream.band-grain::after, .band-sage.band-grain::after, .band-olive.band-grain::after { mix-blend-mode: multiply; opacity: .07; }
    .band-linen::before {
      content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 0;
      background-image:
        repeating-linear-gradient(0deg, transparent 0 3px, rgba(31,61,46,.025) 3px 4px),
        repeating-linear-gradient(90deg, transparent 0 5px, rgba(201,164,92,.04) 5px 6px);
      opacity: .85;
    }
    .band-blueprint::before {
      content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 0;
      background-image:
        linear-gradient(rgba(201,164,92,.13) 1px, transparent 1px),
        linear-gradient(90deg, rgba(201,164,92,.13) 1px, transparent 1px);
      background-size: 28px 28px;
    }
    .frost, .band-ink .listing, .band-ink .copy-card, .band-ink .ph-card, .band-ink .form-card, .band-ink .exp, .band-ink .legal-card {
      background: rgba(255,252,246,.82);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(201,164,92,.28);
      box-shadow: 0 1px 0 rgba(255,255,255,.55) inset, 0 2px 6px rgba(0,0,0,.06), 0 16px 36px rgba(0,0,0,.16);
    }
    .band-ink .section-kicker { color: var(--gold); }
    .band-ink .section h2, .band-ink .form-card h2 { color: #FFFCF6; }
    .band-ink .section .sub, .band-ink .form-card .sub { color: rgba(251,247,239,.86); }
    .band-ink .section .sub b { color: var(--gold-soft); }
    .band-ink .deal-toggle button, .band-ink .cat-chips button {
      background: rgba(255,252,246,.1);
      border-color: rgba(201,164,92,.38);
      color: var(--gold-soft);
    }
    .band-ink .deal-toggle button.on, .band-ink .cat-chips button.on {
      background-image: var(--foil);
      background-size: 200% 100%;
      color: var(--green-deep);
      border-color: var(--gold);
    }
    .band-ink .empty { color: rgba(251,247,239,.8); }
    .form-card, .listing, .ph-card, .copy-card, .exp {
      box-shadow: var(--shadow);
    }
    .hero-legal-wrap.band-linen { position: relative; isolation: isolate; overflow: hidden; }
    .hero-legal-wrap.band-linen .hero-legal { position: relative; z-index: 1; }


    .hero { position: relative; background: linear-gradient(180deg, var(--green-deep) 0%, var(--green) 55%, var(--green-mid) 100%); color: var(--cream); overflow: hidden; min-height: calc(100svh - var(--demo-h)); display: flex; flex-direction: column; justify-content: flex-end; padding: 36px 0 0; }
    body.view-home .hero { padding-bottom: calc(var(--cta-h) + var(--safe-b) + 8px); }
    @media (min-width: 720px) { body.view-home .hero { padding-bottom: 16px; } }
    .hero::before { content: ""; position: absolute; inset: 0; background-image: radial-gradient(ellipse at 20% 0%, rgba(201,164,92,.16), transparent 50%), radial-gradient(ellipse at 90% 20%, rgba(255,252,246,.05), transparent 40%); pointer-events: none; }
    .hero-texture { position: absolute; inset: 0; pointer-events: none; opacity: .07; background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='80' height='80'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }
    .hero-diorama { position: relative; z-index: 1; width: min(640px, 96%); margin: 4px auto 8px; pointer-events: none; animation: dioramaFloat 5.6s ease-in-out infinite; }
    @media (max-width: 719px) { body.view-home .hero-diorama { margin-bottom: calc(var(--cta-h) + var(--safe-b) + 8px); } }
    .hero-diorama img { width: 100%; height: auto; display: block; filter: drop-shadow(0 16px 28px rgba(0,0,0,.28)); }
    @keyframes dioramaFloat { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
    .hero-inner { position: relative; z-index: 1; width: min(560px, 100%); margin: 0 auto; padding: 0 20px 16px; }
    .hero-photo { width: 118px; height: 118px; margin: 0 auto 18px; border-radius: 50%; border: 2px solid var(--gold); padding: 3px; box-shadow: 0 0 0 8px rgba(201,164,92,.12), 0 16px 40px rgba(0,0,0,.25); background: var(--green-deep); }
    .hero-photo img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
    .hero .team { text-align: center; font-size: 12px; letter-spacing: .18em; color: var(--gold); font-weight: 600; margin-bottom: 8px; }
    .hero h1 { text-align: center; font-size: clamp(32px, 9vw, 42px); line-height: 1.2; color: #FFFCF6; margin-bottom: 6px; }
    .hero .role { text-align: center; font-size: 13px; color: var(--gold-soft); margin-bottom: 14px; }
    .hero .lead { text-align: center; font-size: 14.5px; color: rgba(251,247,239,.86); margin-bottom: 22px; }
    .hero-ctas { display: grid; gap: 10px; }
    .hero-ctas .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border-radius: 11px; padding: 12px 16px; font-weight: 700; font-size: 15px; text-decoration: none; transition: transform .15s ease, box-shadow .15s ease, background .15s ease, color .15s ease, border-color .15s ease; box-shadow: 0 4px 14px rgba(0,0,0,.12); }
    .btn svg { width: 22px; height: 22px; overflow: visible; flex: 0 0 22px; }
    .btn .ico-3d { width: 28px; height: 28px; flex: 0 0 28px; object-fit: contain; filter: drop-shadow(0 1px 2px rgba(21,40,31,.2)); }
    .btn:active { transform: translateY(1px) scale(.99); }
    .btn-gold { position: relative; overflow: hidden; color: var(--green-deep); background-image: var(--foil); background-size: 220% 100%; background-position: 0 50%; box-shadow: 0 1px 0 rgba(255,255,255,.35) inset, 0 6px 18px rgba(201,164,92,.32), 0 14px 28px rgba(21,40,31,.12); }
    .btn-gold > * { position: relative; z-index: 1; }
    .btn-gold::after { content: ""; position: absolute; inset: 0; background: linear-gradient(105deg, transparent 35%, rgba(255,255,255,.48) 50%, transparent 65%); transform: translateX(-130%); animation: foilShimmer 5.2s ease-in-out infinite; pointer-events: none; }
    .btn-gold:hover { background-position: 80% 50%; filter: brightness(1.05); }
    @keyframes foilShimmer { 0%, 28% { transform: translateX(-130%); } 62%, 100% { transform: translateX(130%); } }
    .btn-outline-gold { background: transparent; color: var(--gold); border: 1px solid var(--gold); box-shadow: none; }
    .btn-outline-gold:hover { background: rgba(201,164,92,.12); }
    .btn-green { background: var(--green); color: var(--gold-soft); border: 1px solid rgba(201,164,92,.35); }
    .btn-green:hover { background: var(--green-mid); }
    .btn-ghost { background: var(--paper); color: var(--green); border: 1px solid var(--line-strong); box-shadow: none; }
    .btn-block { width: 100%; }

    .cta-bar { display: none; position: fixed; left: 0; right: 0; bottom: 0; z-index: 55; background: var(--green-deep); border-top: 1px solid rgba(201,164,92,.35); padding: 8px 10px calc(8px + var(--safe-b)); grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
    body.view-home .cta-bar { display: grid; }
    @media (min-width: 720px) { body.view-home .cta-bar { display: none; } }
    .cta-bar a { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-decoration: none; color: var(--gold-soft); font-size: 11px; font-weight: 600; letter-spacing: .04em; border-radius: 10px; padding: 6px 4px; }
    .cta-bar a.primary { position: relative; overflow: hidden; color: var(--green-deep); background-image: var(--foil); background-size: 220% 100%; box-shadow: 0 1px 0 rgba(255,255,255,.3) inset, 0 4px 12px rgba(201,164,92,.28); }
    .cta-bar a.primary::after { content: ""; position: absolute; inset: 0; background: linear-gradient(105deg, transparent 35%, rgba(255,255,255,.48) 50%, transparent 65%); transform: translateX(-130%); animation: foilShimmer 5.2s ease-in-out infinite; pointer-events: none; }
    .cta-bar a svg { width: 22px; height: 22px; overflow: visible; }
    .cta-bar a .ico-3d { width: 30px; height: 30px; object-fit: contain; filter: drop-shadow(0 1px 2px rgba(0,0,0,.25)); }

    .section { padding: 36px 0 8px; }
    .section-kicker { font-size: 12px; color: var(--gold-dim); font-weight: 600; letter-spacing: .14em; margin-bottom: 6px; }
    .section h2 { font-size: 24px; margin-bottom: 8px; color: var(--green); }
    .section .sub { font-size: 14px; color: var(--ink-soft); margin-bottom: 18px; }
    .gold-line { width: 56px; height: 3px; border-radius: 2px; margin: 0 0 18px; background: var(--foil); background-size: 200% 100%; box-shadow: 0 0 8px rgba(201,164,92,.4); }
    .gold-rule { border: 0; height: 2px; background: var(--foil); background-size: 200% 100%; opacity: .7; margin: 0; }
    .services-main { display: grid; gap: 14px; }
    .service, .copy-card { background: var(--paper); border: 1px solid var(--line); border-radius: 16px; padding: 18px 16px; display: grid; grid-template-columns: 56px 1fr; gap: 14px; align-items: start; box-shadow: var(--shadow); color: inherit; text-decoration: none; }
    .copy-card { grid-template-columns: 1fr; gap: 8px; }
    .service-ico { width: 56px; height: 56px; border-radius: 14px; display: grid; place-items: center; border: 1.5px solid transparent; background: linear-gradient(180deg, #F7F1E4, #E8DCC0) padding-box, var(--foil) border-box; box-shadow: 0 1px 0 rgba(255,255,255,.7) inset, 0 2px 4px rgba(21,40,31,.08), 0 8px 18px rgba(31,61,46,.1); }
    .copy-card .service-ico { width: 72px; height: 72px; background: linear-gradient(180deg, #FBF7EF, #EDE6D4) padding-box, var(--foil) border-box; }
    .service-ico svg { width: 44px; height: 44px; overflow: visible; }
    .service-ico .ico-3d { width: 62px; height: 62px; object-fit: contain; }
    .copy-card .en { font-size: 11px; letter-spacing: .12em; font-weight: 700; color: var(--gold-dim); text-transform: uppercase; margin: 2px 0 6px; }
    .service h3, .copy-card h3 { font-size: 18px; font-weight: 700; color: var(--green); margin-bottom: 2px; font-family: var(--serif); line-height: 1.35; }
    .service p, .copy-card p { font-size: 14px; color: var(--ink-soft); }
    .copy-bullets { list-style: none; display: grid; gap: 6px; margin: 4px 0 0; padding: 0; }
    .copy-bullets li { display: grid; grid-template-columns: 1em 1fr; gap: 2px; align-items: start; font-size: 13px; color: var(--ink-soft); line-height: 1.55; }
    .copy-bullets li::before { content: "・"; color: var(--green); font-weight: 700; }
    .copy-card .go { font-size: 12px; font-weight: 700; color: var(--gold-dim); margin-top: 6px; }
    a.copy-card:hover, a.service:hover { border-color: var(--gold-dim); box-shadow: var(--shadow), 0 0 0 1px rgba(201,164,92,.25); }
    @media (min-width: 720px) {
      .services-main { grid-template-columns: 1fr 1fr 1fr; }
    }
    .listing-grid { display: grid; gap: 12px; }
    @media (min-width: 560px) { .listing-grid { grid-template-columns: 1fr 1fr; } }
    .listing { background: var(--paper); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; box-shadow: var(--shadow); text-align: left; width: 100%; color: inherit; display: block; }
    .listing:hover { border-color: var(--gold-dim); }
    .listing-art { height: 148px; position: relative; overflow: hidden; }
    .listing-art svg { width: 100%; height: 100%; display: block; }
    .listing-art-3d, .ph-art-3d { width: 100%; height: 100%; display: grid; place-items: center; background: linear-gradient(180deg, #F7F1E4 0%, #E8EFE3 48%, #D5E0CC 100%); }
    .listing-art-3d .ico-3d, .ph-art-3d .ico-3d { width: 72%; height: auto; max-height: 88%; object-fit: contain; filter: drop-shadow(0 10px 16px rgba(21,40,31,.18)); }
    .listing-art .tag { position: absolute; top: 10px; left: 10px; font-size: 11px; font-weight: 700; letter-spacing: .06em; padding: 3px 8px; border-radius: 999px; }
    .tag-出售 { background: var(--green); color: var(--gold-soft); }
    .tag-出租 { background: var(--gold); color: var(--green-deep); }
    .listing-art .sample { position: absolute; top: 10px; right: 10px; font-size: 10px; font-weight: 700; background: rgba(255,252,246,.92); color: var(--muted); padding: 2px 6px; border-radius: 4px; }
    .listing-body { padding: 12px 14px 14px; }
    .listing-body h3 { font-size: 15px; color: var(--green); margin-bottom: 4px; font-family: var(--serif); }
    .listing-meta { font-size: 12px; color: var(--muted); }
    .listing-price { margin-top: 8px; font-weight: 700; color: var(--green); font-size: 16px; }

    .modal-bg { position: fixed; inset: 0; z-index: 80; background: rgba(21,40,31,.55); display: grid; place-items: end center; padding: 16px 12px calc(16px + var(--safe-b)); }
    .modal { width: min(520px, 100%); background: var(--paper); border-radius: 16px; overflow: hidden; box-shadow: 0 20px 50px rgba(0,0,0,.25); max-height: 88dvh; overflow-y: auto; animation: pop .25s ease; }
    @keyframes pop { from { transform: translateY(18px); opacity: 0; } to { transform: none; opacity: 1; } }
    .modal-art { height: 148px; position: relative; overflow: hidden; }
    .modal-body { padding: 18px 16px 20px; }
    .modal-body h3 { font-size: 20px; color: var(--green); margin: 6px 0 8px; }
    .modal dl { display: grid; grid-template-columns: 72px 1fr; gap: 4px 8px; font-size: 13px; margin: 10px 0 14px; }
    .modal dt { color: var(--muted); }
    .modal dd { color: var(--ink); }
    .modal-close { position: absolute; top: 10px; right: 10px; background: rgba(255,252,246,.92); color: var(--ink); width: 32px; height: 32px; border-radius: 50%; font-size: 18px; font-weight: 700; }

    .form-card { background: var(--paper); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); padding: 22px 16px 24px; margin: 8px 0 8px; }
    .form-card h2 { font-size: 24px; color: var(--green); margin-bottom: 4px; }
    .form-card .sub { font-size: 13px; color: var(--muted); margin-bottom: 18px; }
    label.fld { display: block; margin-bottom: 14px; }
    label.fld > span, .fld-label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: var(--ink); }
    .req { color: #9A3B2F; margin-left: 2px; }
    .opt { color: var(--muted); font-weight: 400; font-size: 12px; margin-left: 4px; }
    input[type="text"], input[type="tel"], input[type="number"], input[type="search"], select, textarea {
      width: 100%; background: #fff; border: 1px solid var(--line-strong); border-radius: 11px; padding: 12px; color: var(--ink); outline: none; appearance: none; -webkit-appearance: none; transition: border-color .15s, box-shadow .15s;
    }
    select { background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8'><path d='M1 1l5 5 5-5' stroke='%234A453E' stroke-width='1.5' fill='none'/></svg>"); background-repeat: no-repeat; background-position: right 12px center; padding-right: 36px; }
    textarea { min-height: 88px; resize: vertical; }
    input:focus, select:focus, textarea:focus { border-color: var(--gold-dim); box-shadow: 0 0 0 3px rgba(201,164,92,.28); }
    .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .choice-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); gap: 8px; }
    .choice { position: relative; }
    .choice input { position: absolute; opacity: 0; pointer-events: none; }
    .choice span { display: block; text-align: center; border: 1px solid var(--line-strong); background: #fff; border-radius: 11px; padding: 10px 6px; font-size: 13px; font-weight: 600; }

  function observeReveal() {
    const nodes = document.querySelectorAll(".reveal");
    if (reduceMotion()) { nodes.forEach(n => n.classList.add("in")); return; }
    const io = new IntersectionObserver((entries) => {
      entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); } });
    }, { threshold: 0.12, rootMargin: "0px 0px -24px 0px" });
    nodes.forEach(n => io.observe(n));
  }

    const raw = (location.hash || "#/").replace(/^#/, "") || "/";

    const view = parts[0] || "home";
    const params = new URLSearchParams(qs || "");
    if (params.get("intent")) formIntent = params.get("intent");
    if (parts[0] === "buy") { formIntent = "buy"; return { view: "home", id: "", scrollForm: true }; }
    if (parts[0] === "sell") { formIntent = "sell"; return { view: "home", id: "", scrollForm: true }; }
    if (parts[0] === "rent") { formIntent = "rent"; return { view: "home", id: "", scrollForm: true }; }
    if (view === "report" && !CONFIG.showManagement) return { view: "home", id: "", scrollForm: false };
    return { view: ["admin", "report"].includes(view) ? view : "home", id: parts[1] || "", scrollForm: false };
  }

  function setNav(view) {
    document.body.classList.toggle("view-home", view === "home");

    });
  }

  function render() {
    document.title = CONFIG.title + "｜示範版";
    const { view, id, scrollForm } = parseHash();
    setNav(view);
    const app = $("#app");
    const paint = () => {
      if (view === "admin") app.innerHTML = renderAdmin();
      else if (view === "report") app.innerHTML = renderReport(id || "wang");
      else app.innerHTML = renderHome();
      bindView(view, id);
      observeReveal();
      if (!firstPaint && !reduceMotion()) {
        app.classList.remove("page-out");
        app.classList.add("page-in");
      }
      firstPaint = false;
      if (scrollForm) {
        setTimeout(() => document.getElementById("form-section")?.scrollIntoView({ behavior: reduceMotion() ? "auto" : "smooth" }), 40);
      } else if (view !== "home") window.scrollTo(0, 0);
    };
    if (!firstPaint && !reduceMotion()) {
      app.classList.remove("page-in");
      app.classList.add("page-out");
      setTimeout(paint, 180);
    } else paint();
  }

    const shareDemo = `https://您的網域/r/${landlord.id}-${CONFIG.reportMonth.replace("-", "")}-x7k2`;
    const notes = [...new Set(props.map(p => p.agentNote))];

      <div class="wrap">
        <header class="page-head no-print">
          <div class="section-kicker">給屋主看的月報</div>
          <h1>代管月報</h1>
          <div class="gold-line"></div>
          <p>每位屋主一份。正式使用時，會用專屬連結傳給對方，不必每月重做 Excel。</p>
        </header>
        <div class="report-bar no-print">
          <select id="landlord-sel" aria-label="選擇屋主">
            ${LANDLORDS.map(l => `<option value="${l.id}" ${l.id === landlord.id ? "selected" : ""}>${esc(l.name)}（${PROPERTIES.filter(p => p.landlordId === l.id).length} 戶）</option>`).join("")}
          </select>
          <div class="btn-row">
            <button class="btn-sm" id="copy-link">複製分享連結</button>
            <button class="btn-sm primary" id="print-btn">列印／存成 PDF</button>
          </div>
        </div>
        <article class="report-sheet">
          <header class="report-head">
            <div class="report-brand">
              <img src="${esc(CONFIG.photo)}" alt="${esc(CONFIG.agentName)}" />
              <div>
                <div class="brand">${esc(CONFIG.agentName)}　${esc(CONFIG.team)}</div>
                <div style="font-size:12px;color:var(--muted)">代管報告　服務區域：${esc(CONFIG.area)}</div>
              </div>
            </div>
            <h1>${esc(CONFIG.reportMonthLabel)} 收支報告 <span class="sample-flag">範例資料</span></h1>
            <div class="to">致 ${esc(landlord.formal)}<br>共 ${props.length} 戶　·　報告日 2026年11月22日</div>
          </header>
          <div class="sum-grid">
            <div class="sum"><label>本月應收租金</label><div class="n">${money(rentDue)}</div></div>
            <div class="sum"><label>本月已收租金</label><div class="n">${money(rentIn)}</div>${unpaid.length ? `<div class="hint">${unpaid.length} 戶尚未入帳</div>` : ""}</div>
            <div class="sum"><label>代管費</label><div class="n">${money(fees)}</div><div class="hint">以已收租金 5% 計（範例）</div></div>
            <div class="sum"><label>修繕支出</label><div class="n">${money(repairs)}</div></div>
            <div class="sum hl"><label>本月淨入帳（已收租金 − 代管費 − 修繕）</label><div class="n">${money(net)}</div><div class="hint">實際撥款日與帳戶，正式版可再補上</div></div>
          </div>
          <h2 style="font-size:16px;margin-bottom:4px;color:var(--green)">租金收取</h2>
          <div class="stack-list">
            ${props.map(p => `<div class="stack-item">
              <div class="stack-title">${esc(p.address)}</div>
              <div class="stack-sub">${esc(p.type)}　${p.ping} 坪　·　房客 ${esc(p.tenant)}</div>
              <div class="stack-foot">
                <span class="num">${money(p.rent)}</span>
                ${p.collected ? `<span class="badge st-已收">已收　${p.collectedOn}</span>` : `<span class="badge st-未收">尚未入帳</span>`}
              </div>
            </div>`).join("")}
            <div class="stack-total"><span>已收合計</span><span>${money(rentIn)}</span></div>
          </div>
          <h2 style="font-size:16px;margin-bottom:4px;color:var(--green)">代管費與修繕支出明細</h2>
          <table class="rpt">
            <thead><tr><th>項目</th><th class="num">金額</th></tr></thead>
            <tbody>
              ${collected.map(p => `<tr><td>代管費　${esc(p.address.split("區")[0] + "區")}</td><td class="num">− ${money(feeOf(p))}</td></tr>`).join("")}
              ${allRepairs.length ? allRepairs.map(r => `<tr><td>${r.date}　${esc(r.item)}<br><span style="color:var(--muted);font-size:11px">${esc(r.address)}</span></td><td class="num">− ${money(r.amount)}</td></tr>`).join("") : `<tr><td>本月無修繕支出</td><td class="num">$0</td></tr>`}
            </tbody>
            <tfoot><tr><td>本月淨入帳</td><td class="num">${money(net)}</td></tr></tfoot>
          </table>
          <h2 style="font-size:16px;margin-bottom:8px;color:var(--green)">合約到期提醒</h2>
          ${soon.length ? soon.map(p => `<div class="warn-banner">${esc(p.address)}　合約將於 ${p.contractEnd} 到期（約 ${daysUntil(p.contractEnd)} 天）。建議近日確認是否續約，或是否需要提前尋找新房客。</div>`).join("") : `<p style="font-size:13px;color:var(--ink-soft);margin-bottom:16px;">本月所管物件，皆尚無 60 天內到期的合約。</p>`}
          <h2 style="font-size:16px;margin:16px 0 8px;color:var(--green)">房況照片</h2>
          <div class="photos">${(props[0] ? props[0].photos : ["客廳","廚房","浴室"]).map(label => `<div class="ph">${esc(label)}</div>`).join("")}</div>
          <p class="fineprint" style="text-align:left;margin:-8px 0 16px;">以上為照片佔位，正式版可從手機直接上傳本月現況。</p>
          <div class="agent-note">
            <b>${esc(CONFIG.agentName)} 的留言</b>
            ${notes.map(n => `<p style="margin-bottom:8px">${esc(n)}</p>`).join("")}
          </div>
          <p class="fineprint" style="text-align:left;">本報告僅供示範。金額、日期、房客與地址皆為虛構之範例資料。</p>
        </article>
        <div class="share-hint no-print">
          「複製分享連結」在示範版會複製目前這頁的預覽網址。正式使用時，會改成一組專屬、可設期限的安全連結。
          <code>${esc(shareDemo)}</code>
        </div>
        ${legalCard()}
        <footer class="site">${esc(CONFIG.agentName)}　${esc(CONFIG.phone)}　LINE ${esc(CONFIG.lineId)}　${esc(CONFIG.team)}</footer>
      </div>`;
  }

  let buyerDraft = {};

  function snapshotBuyerForm() {
    const form = $("#buyer-form");
    if (!form) return;
    const fd = new FormData(form);
    for (const [k, v] of fd.entries()) {
      if (k === "types") continue;
      buyerDraft[k] = v;
    }
    buyerDraft.types = [...form.querySelectorAll('input[name="types"]:checked')].map(i => i.value);
  }

  function restoreBuyerForm() {
    const form = $("#buyer-form");
    if (!form) return;
    Object.entries(buyerDraft).forEach(([k, v]) => {
      if (k === "types") return;
      const els = form.querySelectorAll(`[name="${k}"]`);
      els.forEach(el => {
        if (el.type === "radio") el.checked = el.value === v;
        else if (el.type !== "checkbox") el.value = v || "";
      });
    });
    (buyerDraft.types || []).forEach(t => {
      const el = form.querySelector(`input[name="types"][value="${t}"]`);
      if (el) el.checked = true;
    });
    toggleBuyerFollows();
  }

  function toggleBuyerFollows() {
    const form = $("#buyer-form");
    if (!form) return;
    const need = form.querySelector('input[name="buyNeed"]:checked')?.value;
    const swap = document.getElementById("swap-box");
    const other = document.getElementById("other-need-box");
    if (swap) swap.hidden = need !== "換屋";
    if (other) other.hidden = need !== "其它";
  }

  function validateBuyerStep(step) {
    const form = $("#buyer-form");
    if (step === 1) {
      if (!form.name.value.trim() || !form.phone.value.trim() || !form.querySelector('input[name="time"]:checked')) {
        toast("請填寫姓名、電話與聯絡時間"); return false;
      }
    }
    if (step === 2) {
      const need = form.querySelector('input[name="buyNeed"]:checked')?.value;
      if (!need) { toast("請選擇需求類型"); return false; }
      if (need === "換屋" && !form.querySelector('input[name="sellNeed"]:checked')) { toast("請選擇是否有售屋需求"); return false; }
    }
    if (step === 3) {
      if (!form.district.value.trim()) { toast("請填寫希望區域"); return false; }
    }
    if (step === 5) {
      if (!form.consent.checked) { toast("請先勾選個資同意"); return false; }
    }
    return true;
  }

  function refreshBuyerStep() {
    snapshotBuyerForm();
    const y = window.scrollY;
    const formSec = document.getElementById("form-section");
    const card = formSec?.querySelector(".form-card");
    if (card) {
      const switcher = intentSwitch();
      // re-render only the form body after switcher? easier to replace buyer form
      const wrap = card;
      const old = document.getElementById("buyer-form");
      if (old) {
        const tmp = document.createElement("div");
        tmp.innerHTML = renderBuyerForm();
        old.replaceWith(tmp.firstElementChild);
        restoreBuyerForm();
        bindBuyerForm();
      }
    }
    document.getElementById("form-section")?.scrollIntoView({ behavior: reduceMotion() ? "auto" : "smooth", block: "start" });
  }

  function bindBuyerForm() {
    const form = $("#buyer-form");
    if (!form) return;
    form.addEventListener("submit", onSubmitBuyer);
    $("#buy-next")?.addEventListener("click", () => {
      snapshotBuyerForm();
      if (!validateBuyerStep(buyStep)) return;
      buyStep = Math.min(5, buyStep + 1);
      refreshBuyerStep();
    });
    $("#buy-prev")?.addEventListener("click", () => {
      snapshotBuyerForm();
      buyStep = Math.max(1, buyStep - 1);
      refreshBuyerStep();
    });
    form.querySelectorAll('input[name="buyNeed"]').forEach(el => el.addEventListener("change", toggleBuyerFollows));
    form.querySelectorAll("[data-facing]").forEach(btn => btn.addEventListener("click", () => {
      const [sit, toward] = btn.dataset.facing.split(",");
      form.facingSit.value = sit;
      form.facingToward.value = toward;
    }));
    const typeBox = document.getElementById("buy-type-chips");
    typeBox?.querySelectorAll('input[name="types"]').forEach(el => el.addEventListener("change", () => {
      if (el.value === "不拘" && el.checked) {
        typeBox.querySelectorAll('input[name="types"]').forEach(x => { if (x.value !== "不拘") x.checked = false; });
      } else if (el.checked) {
        const any = typeBox.querySelector('input[value="不拘"]');
        if (any) any.checked = false;
      }
    }));
    toggleBuyerFollows();
  }

  function bindListings() {
    const refresh = () => {
      const y = window.scrollY;
      const hold = document.getElementById("listings-section");
      const top = hold ? hold.getBoundingClientRect().top + window.scrollY : y;
      const sec = renderListingsSection();
      const tmp = document.createElement("div");
      tmp.innerHTML = sec.trim();
      hold?.replaceWith(tmp.firstElementChild);
      bindListings();
      window.scrollTo(0, top);
    };
    document.querySelectorAll("[data-deal]").forEach(b => b.addEventListener("click", () => {
      listingDeal = b.dataset.deal;
      refresh();
    }));
    document.querySelectorAll("[data-cat]").forEach(b => b.addEventListener("click", () => {
      listingCat = b.dataset.cat;
      refresh();
    }));
    document.querySelectorAll("[data-listing]").forEach(btn => btn.addEventListener("click", () => {
      const item = CONFIG.listings.find(x => x.id === btn.dataset.listing);
      if (item) openListing(item);
    }));
    document.querySelector(".cat-chips button.on")?.scrollIntoView({ inline: "center", block: "nearest" });
  }

  function bindView(view, id) {
    if (view === "home") {
      document.querySelectorAll("[data-intent]").forEach(b => b.addEventListener("click", () => {
        formIntent = b.dataset.intent;
        buyStep = 1;
        const y = document.getElementById("form-section")?.getBoundingClientRect().top + window.scrollY || window.scrollY;
        $("#app").innerHTML = renderHome();
        bindView("home");
        observeReveal();
        document.querySelectorAll(".reveal").forEach(n => n.classList.add("in"));
        window.scrollTo(0, y);
      }));
      $("#lead-form")?.addEventListener("submit", onSubmitLead);
      $("#rent-form")?.addEventListener("submit", onSubmitRent);
      bindBuyerForm();
      bindListings();
    }
    if (view === "admin") {
      document.querySelectorAll(".subtabs button").forEach(b => b.addEventListener("click", () => { adminTab = b.dataset.tab; render(); }));
      document.querySelectorAll("#lead-filters button").forEach(b => b.addEventListener("click", () => { leadFilter = b.dataset.f; render(); }));
      const q = $("#lead-q");
      if (q) q.addEventListener("input", (e) => { leadQuery = e.target.value; refreshAdminList(); });
      bindLeadActions();
    }
    if (view === "report") {
      const sel = $("#landlord-sel");
      if (sel) sel.addEventListener("change", () => { location.hash = "#/report/" + sel.value; });
      $("#print-btn")?.addEventListener("click", () => window.print());
      $("#copy-link")?.addEventListener("click", async () => {
        const lid = (sel ? sel.value : id) || "wang";
        const url = location.origin + location.pathname + "#/report/" + lid;
        try { await navigator.clipboard.writeText(url); toast("已複製本機預覽連結"); }
        catch { toast("請手動複製網址列的連結"); }
      });
    }
  }

  function openListing(item) {
    const wrap = document.createElement("div");
    wrap.innerHTML = renderListingModal(item);
    const bg = wrap.firstElementChild;
    document.body.appendChild(bg);
    const close = () => bg.remove();
    $("#modal-close", bg).addEventListener("click", close);
    bg.addEventListener("click", (e) => { if (e.target === bg) close(); });
    $("#modal-inquiry", bg)?.addEventListener("click", () => { close(); });
  }

  function refreshAdminList() {
    const qEl = $("#lead-q");
    const pos = qEl ? qEl.selectionStart : null;
    const y = window.scrollY;
    $("#app").innerHTML = renderAdmin();
    bindView("admin");
    const q2 = $("#lead-q");
    if (q2) { q2.focus(); if (pos != null) q2.setSelectionRange(pos, pos); }
    window.scrollTo(0, y);
  }

  function bindLeadActions() {
    document.querySelectorAll("[data-status]").forEach(sel => sel.addEventListener("change", () => {
      updateLead(sel.dataset.status, l => { l.status = sel.value; });
    }));
    document.querySelectorAll("[data-add-note]").forEach(btn => btn.addEventListener("click", () => {
      const id = btn.dataset.addNote;
      const input = document.querySelector(`[data-note-input="${id}"]`);
      const text = (input && input.value || "").trim();
      if (!text) return;
      updateLead(id, l => { l.notes = l.notes || []; l.notes.push("11/22 " + text); });
    }));
    document.querySelectorAll("[data-del]").forEach(btn => btn.addEventListener("click", () => {
      if (!confirm("刪除這筆本機資料？範例名單不會被刪除。")) return;
      saveLeads(loadLeads().filter(l => l.id !== btn.dataset.del));
      toast("已刪除");
      render();
    }));
  }

  function updateLead(id, fn) {
    if (SAMPLE_LEADS.some(l => l.id === id)) {
      fn(SAMPLE_LEADS.find(x => x.id === id));
      render();
      toast("已更新（範例資料，重新整理會回到預設）");
      return;
    }
    const list = loadLeads();
    const l = list.find(x => x.id === id);
    if (l) { fn(l); saveLeads(list); }
    render();
    toast("已更新");
  }

  function showThanks(name) {
    const app = $("#app");
    app.innerHTML = renderThanks(name);
    document.body.classList.add("view-home");
    $("#again").addEventListener("click", () => { buyStep = 1; location.hash = "#/"; render(); });
    window.scrollTo(0, 0);
  }

  function onSubmitLead(e) {
    e.preventDefault();
    const fd = new FormData(e.target);
    if (!fd.get("consent")) { toast("請先勾選個資同意"); return; }
    const need = fd.get("need");
    const kind = (CONFIG.showManagement && need === "想委託代管") ? "代管" : need === "想出租" ? "出租" : "賣方";
    saveLeads([{
      id: "u" + Date.now(), kind, name: fd.get("name").trim(), phone: fd.get("phone").trim(),
      lineId: (fd.get("lineId") || "").trim(), address: fd.get("address").trim(), type: fd.get("type"),
      areaPing: fd.get("areaPing") || "", age: fd.get("age") || "", need, price: (fd.get("price") || "").trim(),
      time: fd.get("time"), note: (fd.get("note") || "").trim(), status: "新進",
      notes: ["由表單送出（本機示範）"], createdAt: "2026-11-22", sample: false
    }, ...loadLeads()]);
    showThanks(fd.get("name").trim());
  }

  function onSubmitRent(e) {
    e.preventDefault();
    const fd = new FormData(e.target);
    if (!fd.get("consent")) { toast("請先勾選個資同意"); return; }
    saveLeads([{
      id: "u" + Date.now(), kind: "租客", name: fd.get("name").trim(), phone: fd.get("phone").trim(),
      lineId: (fd.get("lineId") || "").trim(), district: fd.get("district").trim(), address: fd.get("district").trim(),
      layout: (fd.get("layout") || "").trim(), need: "想租房", price: (fd.get("price") || "").trim(),
      time: fd.get("time"), note: (fd.get("note") || "").trim(), status: "新進",
      notes: ["由租屋需求表送出（本機示範）"], createdAt: "2026-11-22", sample: false
    }, ...loadLeads()]);
    showThanks(fd.get("name").trim());
  }

  function onSubmitBuyer(e) {
    e.preventDefault();
    snapshotBuyerForm();
    if (!validateBuyerStep(5)) return;
    const d = buyerDraft;
    saveLeads([{
      id: "u" + Date.now(), kind: "買方", name: (d.name || "").trim(), phone: (d.phone || "").trim(),
      lineId: (d.lineId || "").trim(), residence: (d.residence || "").trim(), time: d.time || "",
      need: "想買", buyNeed: d.buyNeed || "", sellNeed: d.sellNeed || "", buyNeedOther: d.buyNeedOther || "",
      district: (d.district || "").trim(), address: (d.district || "").trim(), areaPing: d.areaPing || "",
      rooms: d.rooms || "", halls: d.halls || "", baths: d.baths || "", parking: d.parking || "",
      priceMin: d.priceMin || "", priceMax: d.priceMax || "", downPayment: d.downPayment || "", loan: d.loan || "",
      otherNeed: d.otherNeed || "", types: d.types || [], age: d.age || "", floor: d.floor || "",
      facingSit: d.facingSit || "", facingToward: d.facingToward || "", transit: d.transit || "",
      status: "新進", notes: ["由買方需求表送出（本機示範）"], createdAt: "2026-11-22", sample: false
    }, ...loadLeads()]);
    buyerDraft = {};
    buyStep = 1;
    showThanks((d.name || "").trim());
  }

  function setupIntro() {
    const el = document.getElementById("intro");
    const skip = () => { el.classList.add("done"); sessionStorage.setItem("realtor-intro-done", "1"); };
    if (reduceMotion() || sessionStorage.getItem("realtor-intro-done")) { el.classList.add("done"); return; }
    document.getElementById("intro-skip").addEventListener("click", skip);
    el.addEventListener("click", skip);
    setTimeout(skip, 1150);
  }

  document.getElementById("cta-form").addEventListener("click", (e) => {
    const { view } = parseHash();
    if (view === "home") {
      const t = document.getElementById("form-section");
      if (t) { e.preventDefault(); t.scrollIntoView({ behavior: reduceMotion() ? "auto" : "smooth" }); }
    } else {
      e.preventDefault();
      location.hash = "#/";
      setTimeout(() => document.getElementById("form-section")?.scrollIntoView({ behavior: "smooth" }), 280);
    }
  });

  function setupChrome() {
    const nav = document.getElementById("demo-nav");
    if (CONFIG.showManagement && nav && !document.getElementById("nav-report")) {
      nav.insertAdjacentHTML("beforeend", '<a href="#/report" id="nav-report">屋主月報</a>');
    }
    document.querySelectorAll("[data-icon]").forEach(el => { el.innerHTML = ICONS.svg(el.dataset.icon); });
  }

  window.addEventListener("hashchange", render);
  setupIntro();
  setupChrome();
  render();
  </script>
</body>
</html>
